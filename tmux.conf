# ==========================================
# 1. KEYBINDINGS & COPY MODE (Vi Style)
# ==========================================

# Enable Vi mode keys for copy mode
set-window-option -g mode-keys vi

# Escape cancels copy mode entirely, just like normal mode in Vi
bind-key -T copy-mode-vi Escape send-keys -X cancel

# 'v' starts character-wise visual selection (Visual Mode)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# 'V' starts line-wise visual selection (Visual Line Mode)
bind-key -T copy-mode-vi V send-keys -X select-line

# 'Ctrl-v' toggles block-wise visual selection (Visual Block Mode)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# 'y' yanks the text to the Wayland clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Allow mouse dragging to also yank to the Wayland clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"


# ==========================================
# 2. TERMINAL, COLOR & ENVIRONMENT FIXES
# ==========================================

# Fix color issues for Ptyxis and Neovim
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"

# Crucial for Toolbox/Ptyxis: Pass Wayland environment variables to tmux panes
# so wl-copy actually knows how to talk to your host system's clipboard
set-option -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR"


# ==========================================
# 3. BEHAVIOR & UI
# ==========================================

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Enable mouse support
set -g mouse on

# Status bar configuration
set -g status-right-length 100
set -g status-right "#($HOME/.config/tmux/status.sh) | %a %Y-%m-%d  %H:%M"


# ==========================================
# 4. PLUGINS (TPM)
# ==========================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Enable automatic restore for tmux-continuum
set -g @continuum-restore 'on'

# Optional: Set autosave interval (default is 15 minutes)
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep these lines at the very bottom)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run "$HOME/.config/tmux/plugins/tpm/tpm"
